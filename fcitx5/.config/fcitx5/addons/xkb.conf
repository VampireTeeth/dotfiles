# ~/.config/fcitx5/addons/xkb.conf
#
# This configuration file tells Fcitx5 how to handle system-level keyboard layouts.

[XKB]
# Disable Fcitx5 from trying to override the system XKB setup.
# Setting this to False ensures Dvorak compatibility.
Rewrite=False

# The following lines usually have default values that you can leave untouched:
# Layout=us
# Variant=
# Options=
# Model=pc105

