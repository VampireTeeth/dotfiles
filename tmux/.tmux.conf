set-option -g default-shell "/bin/bash"
set-option -g default-command "bash -l"
set-option -g default-terminal "screen-256color"

set-option -g prefix C-b
bind-key C-b send-prefix

set -g base-index 1

# When the last window in a session is killed, switch to another session
# instead of detaching the client.
set -g detach-on-destroy off

# Set style

#set inactive/active window styles
set -g window-style 'fg=colour247,bg=colour236'
set -g window-active-style 'fg=colour150,bg=black'

# set the pane border colors 
set -g pane-border-style fg=colour235,bg=colour238
set -g pane-active-border-style fg=colour236,bg=colour250
#set -g pane-border-fg colour235
#set -g pane-border-bg colour238
#set -g pane-active-border-fg colour236 
#set -g pane-active-border-bg colour250 

# Automatically set window title
set-window-option -g automatic-rename off 
set-option -g set-titles on

set -g history-limit 10000

setw -g mode-keys vi
# setw -g mode-mouse on
setw -g monitor-activity on

bind-key C-v split-window -h
bind-key C-s split-window -v

# Use Shift-arrow keys without prefix key to switch panes
bind -n S-Left select-pane -L
bind -n S-Right select-pane -R
bind -n S-Up select-pane -U
bind -n S-Down select-pane -D

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME
set -g status-bg black
set -g status-fg white
#set -g window-status-current-bg white
#set -g window-status-current-fg black
#set -g window-status-current-attr bold
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'

# fzf-powered session/window switchers (override default 's' and 'w')
bind s display-popup -E -w 75% -h 60% "\
    tmux list-sessions -F '#{session_name}' | \
    fzf --reverse --header 'Switch Tmux Session' | \
    xargs -I {} tmux switch-client -t '{}'"

bind w display-popup -E -w 75% -h 60% "\
    tmux list-windows -F '#{window_index}: #{window_name}' | \
    fzf --reverse --header 'Switch Tmux Window' | \
    cut -d ':' -f 1 | \
    xargs -I {} tmux select-window -t '{}'"

# Plugins (requires TPM: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

run '~/.tmux/plugins/tpm/tpm'
